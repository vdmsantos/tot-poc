<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sala de Voz</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #313338;
      --bg-card: #2b2d31;
      --bg-elevated: #1e1f22;
      --bg-hover: #3f4248;
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --text-dim: #6d6f78;
      --green: #23a55a;
      --red: #da373c;
      --accent: #5865f2;
      --accent-hover: #4752c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "gg sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 300px;
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
    .channel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 12px 8px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 15px;
    }
    .channel svg { flex-shrink: 0; }

    .participants {
      list-style: none;
      margin: 0;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .participant {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .participant:hover { background: var(--bg-hover); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #8791ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .participant.self .avatar { background: linear-gradient(135deg, #23a55a, #3ba55d); }
    .pname {
      flex: 1;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mic-state { color: var(--text-muted); flex-shrink: 0; display: flex; }
    .mic-state.muted { color: var(--red); }

    .join-wrap { padding: 8px 12px 14px; }
    button { font: inherit; cursor: pointer; border: none; }
    .join-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .join-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .join-btn:disabled { opacity: .6; cursor: default; }
    .hint {
      margin-top: 10px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }
    .hint.error { color: var(--red); }

    .voice-bar { background: var(--bg-elevated); padding: 8px 10px; margin-top: 8px; }
    .voice-status { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
    .voice-status .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0;
    }
    .voice-status-text { font-size: 12px; line-height: 1.3; overflow: hidden; }
    .voice-status-text .line1 { color: var(--green); font-weight: 600; }
    .voice-status-text .line2 {
      color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--bg-hover);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover:not(:disabled):not(.muted-btn):not(.active) { background: #4a4d54; }
    .icon-btn.active { background: var(--text); color: var(--bg-elevated); }
    .icon-btn.muted-btn { background: var(--red); color: #fff; }
    .icon-btn.muted-btn:hover { background: #c62d31; }
    .icon-btn.leave { color: var(--text-muted); }
    .icon-btn.leave:hover:not(:disabled) { color: #fff; background: var(--red); }
    .icon-btn:disabled { opacity: .4; cursor: default; }

    /* A tela compartilhada fica fora do card (que é pequeno, estilo
       Discord) pra poder ocupar quase a tela toda enquanto alguém
       apresenta. */
    #screens:empty { display: none; }
    #screens {
      width: 90vw;
      max-width: 90vw;
    }
    #screens video {
      display: block;
      width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  </style>
</head>
<body>
  <div id="screens"></div>

  <div class="card">
    <div class="channel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3 7 7H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3l5 4V3z"/>
        <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 4.4v2.1c2.89 1.15 4.5 3.68 4.5 5.5 0 1.83-1.61 4.36-4.5 5.51v2.09c4-1.2 6.5-4.44 6.5-7.6S18 5.6 14 4.4z"/>
      </svg>
      <span>Sala de Voz</span>
    </div>

    <ul id="participants" class="participants"></ul>

    <div id="joinWrap" class="join-wrap">
      <button id="join" class="join-btn">Entrar na sala</button>
      <div id="hint" class="hint">Abra esta mesma página em outra aba ou dispositivo pra testar.</div>
    </div>

    <div id="voiceBar" class="voice-bar" hidden>
      <div class="voice-status">
        <span class="dot"></span>
        <div class="voice-status-text">
          <div class="line1">Voz conectada</div>
          <div class="line2">Sala de Voz</div>
        </div>
      </div>
      <div class="controls">
        <button id="muteBtn" class="icon-btn" title="Mutar microfone">
          <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/>
            <line class="slash" x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
          </svg>
        </button>
        <button id="shareScreen" class="icon-btn" title="Compartilhar tela" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h5v2H7a1 1 0 1 0 0 2h10a1 1 0 1 0 0-2h-2v-2h5a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H4zm0 2h16v7H4V7z"/>
            <path d="M12 8.3 9.4 11h1.8v2.6h1.6V11h1.8L12 8.3z"/>
          </svg>
        </button>
        <button id="leaveBtn" class="icon-btn leave" title="Sair da sala">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 9c-4 0-7.5 1.5-10 4a1.5 1.5 0 0 0-.3 2l2.2 2.9a1.5 1.5 0 0 0 2.1.3l2-1.5a1.5 1.5 0 0 0 .5-1.8l-.6-1.6c.9-.3 2-.5 4.1-.5s3.2.2 4.1.5l-.6 1.6a1.5 1.5 0 0 0 .5 1.8l2 1.5a1.5 1.5 0 0 0 2.1-.3l2.2-2.9a1.5 1.5 0 0 0-.3-2c-2.5-2.5-6-4-10-4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="audios" hidden></div>

  <script>
    // ==================== CONFIGURAÇÃO DE QUALIDADE ====================
    // Ajuste estes valores conforme sua necessidade.
    const CONFIG = {
      // Bitrate do áudio em bits por segundo.
      //   ~32000  = padrão do WebRTC (voz simples)
      //   64000   = qualidade "Discord" (bom pra conversa)  <-- padrão daqui
      //   128000+ = alta fidelidade (bom pra música)
      bitrate: 64000,

      // Modo música: se true, DESLIGA os filtros do microfone (eco, ruído,
      // ganho automático) e usa estéreo. Use false para conversa/voz.
      musica: false,

      // Compartilhamento de tela: teto de bitrate e resolução/fps máximos,
      // pra não pesar demais na banda de quem está assistindo.
      videoBitrate: 2_500_000, // ~2.5 Mbps: dá pra ler texto na tela com folga
      videoMaxWidth: 1920,
      videoMaxHeight: 1080,
      videoMaxFps: 30,
    };
    // ==================================================================

    const joinBtn = document.getElementById('join');
    const shareBtn = document.getElementById('shareScreen');
    const muteBtn = document.getElementById('muteBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const joinWrapEl = document.getElementById('joinWrap');
    const voiceBarEl = document.getElementById('voiceBar');
    const hintEl = document.getElementById('hint');
    const participantsEl = document.getElementById('participants');
    const audiosEl = document.getElementById('audios');
    const screensEl = document.getElementById('screens');

    const ICON_MIC_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/></svg>';
    const ICON_MIC_MUTED_SMALL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

    // Preenchidos depois de "Entrar na sala".
    let pc = null;
    let ws = null;
    let localAudioTrack = null;
    let micEnabled = true;
    let videoSender = null;
    let placeholderVideoTrack = null;
    let screenTrack = null;
    let sharingScreen = false;
    let remoteScreenEl = null; // <video> de quem está compartilhando agora (se for outra pessoa)
    let otherCount = 0; // quantidade de OUTROS participantes, informada pelo servidor

    joinBtn.onclick = async () => {
      joinBtn.disabled = true;
      hintEl.textContent = 'Pedindo acesso ao microfone...';
      hintEl.classList.remove('error');

      // Restrições de captura do microfone (qualidade da entrada).
      const audioConstraints = {
        echoCancellation: !CONFIG.musica,   // tira eco (bom pra voz)
        noiseSuppression: !CONFIG.musica,   // tira ruído de fundo (bom pra voz)
        autoGainControl:  !CONFIG.musica,   // nivela o volume (bom pra voz)
        channelCount:     CONFIG.musica ? 2 : 1, // estéreo pra música, mono pra voz
        sampleRate:       48000,            // taxa nativa do Opus
      };

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
      } catch (e) {
        hintEl.textContent = 'Não foi possível acessar o microfone: ' + e.message;
        hintEl.classList.add('error');
        joinBtn.disabled = false;
        return;
      }

      localAudioTrack = stream.getAudioTracks()[0];

      // Busca a config de STUN/TURN no servidor (credenciais ficam lá, não aqui).
      let iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      try {
        const r = await fetch('/config');
        if (r.ok) iceConfig = await r.json();
      } catch (e) {
        console.warn('Não consegui buscar /config, usando só STUN:', e);
      }

      pc = new RTCPeerConnection(iceConfig);

      // Envia nosso áudio para o servidor e aplica o bitrate desejado.
      const audioSender = pc.addTrack(localAudioTrack, stream);
      const audioParams = audioSender.getParameters();
      if (!audioParams.encodings) audioParams.encodings = [{}];
      audioParams.encodings[0].maxBitrate = CONFIG.bitrate;
      audioSender.setParameters(audioParams).catch(err => console.warn('setParameters:', err));

      // Reserva desde já o "canal" de vídeo pro compartilhamento de tela,
      // usando uma track de vídeo real (canvas em branco, sem gerar frames
      // sozinha) em vez de uma transceiver vazia — isso garante que o
      // navegador negocie esse m-line corretamente como apto a enviar,
      // igual já acontece com o áudio. Quando alguém compartilhar a tela,
      // basta trocar a track (replaceTrack) sem precisar renegociar de novo.
      placeholderVideoTrack = document.createElement('canvas').captureStream(0).getVideoTracks()[0];
      videoSender = pc.addTrack(placeholderVideoTrack, stream);

      // Toca o áudio e mostra o vídeo (tela compartilhada) que chegam dos
      // outros participantes.
      pc.ontrack = (event) => {
        const isVideo = event.track.kind === 'video';
        const el = document.createElement(isVideo ? 'video' : 'audio');
        el.srcObject = event.streams[0];
        el.autoplay = true;
        if (isVideo) {
          el.playsInline = true;
          el.muted = true; // a tela compartilhada não tem áudio nesta versão
          if (remoteScreenEl) remoteScreenEl.remove();
          remoteScreenEl = el;
          screensEl.appendChild(el);
        } else {
          audiosEl.appendChild(el);
        }
        event.track.onended = () => el.remove();
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') leaveRoom();
      };

      ws = new WebSocket(
        (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'
      );

      // O servidor pode mandar várias ofertas em sequência rápida (ex.:
      // quando alguém sai, o resync dispara mais de uma renegociação em
      // poucos milissegundos). Processar duas ofertas ao mesmo tempo deixa
      // a negociação (setRemoteDescription/setLocalDescription) num estado
      // inconsistente, então encadeamos tudo numa fila e processamos uma
      // por vez, na ordem em que chegaram.
      let negotiationChain = Promise.resolve();

      // Manda candidatos ICE para o servidor.
      pc.onicecandidate = (e) => {
        if (e.candidate) {
          ws.send(JSON.stringify({ event: 'candidate', data: JSON.stringify(e.candidate) }));
        }
      };

      ws.onopen = () => {
        joinWrapEl.hidden = true;
        voiceBarEl.hidden = false;
        shareBtn.disabled = false;
        renderParticipants();
      };
      ws.onclose = () => leaveRoom();

      // O servidor é quem faz a oferta (padrão do SFU); nós respondemos.
      ws.onmessage = async (msg) => {
        const m = JSON.parse(msg.data);
        if (!m) return;

        if (m.event === 'offer') {
          negotiationChain = negotiationChain.then(async () => {
            const offer = JSON.parse(m.data);
            await pc.setRemoteDescription(offer);
            const answer = await pc.createAnswer();
            answer.sdp = ajustarOpus(answer.sdp);   // liga FEC, bitrate e estéreo no Opus
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ event: 'answer', data: JSON.stringify(answer) }));
          }).catch(err => console.error('Erro processando oferta:', err));
          await negotiationChain;
        } else if (m.event === 'candidate') {
          const candidate = JSON.parse(m.data);
          await pc.addIceCandidate(candidate);
        } else if (m.event === 'roster') {
          // O servidor manda o total de gente na sala (nos contando); a
          // lista de participantes sempre reflete esse número.
          otherCount = Math.max(0, parseInt(m.data, 10) - 1);
          renderParticipants();
        } else if (m.event === 'screenshare-start') {
          // Alguém (talvez eu mesmo) começou a compartilhar: só sobra livre
          // pra ninguém mais até essa pessoa parar.
          if (!sharingScreen) shareBtn.disabled = true;
        } else if (m.event === 'screenshare-stop') {
          if (!sharingScreen) shareBtn.disabled = false;
          if (remoteScreenEl) {
            remoteScreenEl.remove();
            remoteScreenEl = null;
          }
        } else if (m.event === 'screenshare-rejected') {
          alert('Alguém já está compartilhando a tela. Tente de novo quando essa pessoa parar.');
        }
      };
    };

    muteBtn.onclick = () => {
      if (!localAudioTrack) return;
      micEnabled = !micEnabled;
      localAudioTrack.enabled = micEnabled;
      muteBtn.classList.toggle('muted-btn', !micEnabled);
      muteBtn.title = micEnabled ? 'Mutar microfone' : 'Desmutar microfone';
      muteBtn.querySelector('.slash').style.display = micEnabled ? 'none' : 'block';
      renderParticipants();
    };

    shareBtn.onclick = async () => {
      if (sharingScreen) {
        await stopSharing();
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { max: CONFIG.videoMaxWidth },
            height: { max: CONFIG.videoMaxHeight },
            frameRate: { max: CONFIG.videoMaxFps },
          },
          audio: false,
        });
      } catch (e) {
        return; // usuário cancelou o seletor de tela/janela
      }

      screenTrack = stream.getVideoTracks()[0];
      await videoSender.replaceTrack(screenTrack);

      const params = videoSender.getParameters();
      if (!params.encodings) params.encodings = [{}];
      params.encodings[0].maxBitrate = CONFIG.videoBitrate;
      videoSender.setParameters(params).catch(err => console.warn('setParameters (vídeo):', err));

      // Se a pessoa parar pelo controle nativo do navegador ("Parar de
      // compartilhar" na barra do Chrome/Edge), avisamos a sala também.
      screenTrack.onended = () => stopSharing();

      sharingScreen = true;
      shareBtn.classList.add('active');
      shareBtn.title = 'Parar compartilhamento';
      ws.send(JSON.stringify({ event: 'screenshare-start', data: '' }));
    };

    async function stopSharing() {
      if (!sharingScreen) return;
      sharingScreen = false;
      shareBtn.classList.remove('active');
      shareBtn.title = 'Compartilhar tela';

      await videoSender.replaceTrack(placeholderVideoTrack);
      if (screenTrack) {
        screenTrack.stop();
        screenTrack = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ event: 'screenshare-stop', data: '' }));
      }
    }

    leaveBtn.onclick = () => leaveRoom();

    function leaveRoom() {
      if (sharingScreen) stopSharing();
      if (ws) { ws.onclose = null; ws.close(); ws = null; }
      if (pc) { pc.close(); pc = null; }
      if (localAudioTrack) { localAudioTrack.stop(); localAudioTrack = null; }
      if (placeholderVideoTrack) { placeholderVideoTrack.stop(); placeholderVideoTrack = null; }

      audiosEl.innerHTML = '';
      screensEl.innerHTML = '';
      remoteScreenEl = null;
      participantsEl.innerHTML = '';
      micEnabled = true;
      sharingScreen = false;
      otherCount = 0;

      voiceBarEl.hidden = true;
      joinWrapEl.hidden = false;
      joinBtn.disabled = false;
      hintEl.textContent = 'Abra esta mesma página em outra aba ou dispositivo pra testar.';
      hintEl.classList.remove('error');
    }

    // Ajusta os parâmetros do codec Opus diretamente no SDP:
    // - useinbandfec=1  -> correção de erros (aguenta melhor perda de pacotes)
    // - maxaveragebitrate -> teto de bitrate
    // - stereo / maxplaybackrate -> qualidade máxima (modo música)
    function ajustarOpus(sdp) {
      // Descobre o número de payload do Opus.
      const m = sdp.match(/a=rtpmap:(\d+) opus\/48000/i);
      if (!m) return sdp;
      const pt = m[1];

      let extras = `useinbandfec=1;maxaveragebitrate=${CONFIG.bitrate}`;
      if (CONFIG.musica) {
        extras += ';stereo=1;sprop-stereo=1;maxplaybackrate=48000';
      }

      const fmtpRegex = new RegExp(`(a=fmtp:${pt} )(.*)`);
      if (fmtpRegex.test(sdp)) {
        // Já existe uma linha fmtp: acrescenta os parâmetros.
        return sdp.replace(fmtpRegex, `$1$2;${extras}`);
      }
      // Não existe: cria uma logo após o rtpmap do Opus.
      return sdp.replace(
        new RegExp(`(a=rtpmap:${pt} opus\\/48000\\/2\\r?\\n)`, 'i'),
        `$1a=fmtp:${pt} ${extras}\r\n`
      );
    }

    function renderParticipants() {
      participantsEl.innerHTML = '';
      participantsEl.appendChild(
        participantRow('Você', 'V', !micEnabled)
      );
      for (let i = 1; i <= otherCount; i++) {
        participantsEl.appendChild(participantRow(`Participante ${i}`, 'P', false));
      }
    }

    function participantRow(name, initial, muted) {
      const li = document.createElement('li');
      li.className = 'participant' + (initial === 'V' ? ' self' : '');
      li.innerHTML = `
        <span class="avatar">${initial}</span>
        <span class="pname">${name}</span>
        <span class="mic-state${muted ? ' muted' : ''}">${muted ? ICON_MIC_MUTED_SMALL : ICON_MIC_SMALL}</span>
      `;
      return li;
    }
  </script>
</body>
</html>
